name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Configuration and PHPCS
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Run PHPCS
        run: composer lint

      - name: Verify bundled translations
        run: composer i18n:verify

  integration:
    name: WordPress ${{ matrix.wordpress }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '6.9'
            wp_core: 'WordPress/WordPress#6.9'
            php: '7.4'
          - wordpress: '6.9'
            wp_core: 'WordPress/WordPress#6.9'
            php: '8.5'
          - wordpress: 'latest'
            wp_core: ''
            php: '8.5'

    env:
      WP_ENV_CORE: ${{ matrix.wp_core }}
      WP_ENV_PHP_VERSION: ${{ matrix.php }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Start the WordPress test environment
        id: wp-env-start
        run: npm run env:start

      - name: Run WordPress integration tests
        run: npm run test:php

      - name: Stop the WordPress test environment
        if: ${{ always() && steps.wp-env-start.outcome == 'success' }}
        run: npm run env:stop

  package:
    name: Distribution ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Build and verify the distribution ZIP
        run: composer package:verify

      - name: Show the distribution contents
        run: unzip -Z1 build/od-ai-content.zip

      - name: Upload the distribution ZIP
        uses: actions/upload-artifact@v6
        with:
          name: od-ai-content
          path: build/od-ai-content.zip
          if-no-files-found: error
